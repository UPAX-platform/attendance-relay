name: windows-check
# The relay on a real Windows machine: unit tests on NTFS, then the service
# installed, paired, rotated, upgraded and uninstalled against a fake UPAX
# (scripts/windows-check.ps1). Runs on PRs to main and by hand; push a
# ci/windows* branch to run it before the workflow is on main.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["ci/windows*"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test -race ./...
      - name: end-to-end
        shell: pwsh
        run: scripts/windows-check.ps1 -Work "$env:RUNNER_TEMP\relaycheck"
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-logs
          path: ${{ runner.temp }}/relaycheck/logs
          if-no-files-found: ignore
